name: Immutable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, for example 0.1.0
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  validate:
    name: Validate exact main CI
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Validate release metadata
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          version="$(tr -d '[:space:]' < version.txt)"
          test "$version" = "$RELEASE_VERSION"
          test "$version" = "$(sed -n 's/^  version: "\(.*\)"/\1/p' \
            modules/nsx-tileio-usb/nsx-module.yaml)"
          test "$version" = "$(sed -n 's/^  version: "\(.*\)"/\1/p' \
            modules/nsx-tileio-ble/nsx-module.yaml)"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tag="v${version}"
          if git ls-remote --exit-code origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Refusing to retarget existing immutable tag ${tag}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Run host contracts on release commit
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Wait for successful CI on exact commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            runs="$(gh run list --workflow ci.yml --commit "$RELEASE_SHA" \
              --json event,headBranch,status,conclusion,headSha --limit 20)"
            state="$(printf '%s' "$runs" | jq -r --arg sha "$RELEASE_SHA" \
              '[.[] | select(.headSha == $sha and .event == "push" and
                .headBranch == "main")] | first |
               if . == null then "missing" else "\(.status)|\(.conclusion)" end')"
            case "$state" in
              completed\|success) exit 0 ;;
              completed\|*) echo "CI failed: $state" >&2; exit 1 ;;
              *) echo "CI state ${state} (${attempt}/60)"; sleep 30 ;;
            esac
          done
          echo "Timed out waiting for CI on ${RELEASE_SHA}" >&2
          exit 1

  publish:
    name: Publish immutable annotated tag and archive
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Create annotated tag
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.validate.outputs.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG" "${{ needs.validate.outputs.sha }}"
          git push origin "$RELEASE_TAG"
      - name: Create archive and checksum
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          archive="nsx-tileio-${RELEASE_TAG#v}.tar.gz"
          git archive --format=tar.gz \
            --prefix="nsx-tileio-${RELEASE_TAG#v}/" "$RELEASE_TAG" -o "$archive"
          sha256sum "$archive" > "${archive}.sha256"
      - name: Upload source archive
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          files: |
            nsx-tileio-${{ inputs.version }}.tar.gz
            nsx-tileio-${{ inputs.version }}.tar.gz.sha256
          generate_release_notes: false
          body_path: RELEASE.md
